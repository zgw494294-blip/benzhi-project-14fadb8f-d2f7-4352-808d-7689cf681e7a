<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舞台吊挂安全工作台</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><h1>舞台吊挂安全工作台</h1><p class="lead">从吊挂方案建档、配装、载荷评估和彩排，一直完成独立复核、凭据签发与验真。</p>
<section><h2>创建或打开案卷</h2><form id="create"><input name="showName" placeholder="演出名称" required><input name="venueZone" placeholder="舞台区域" required><input name="performanceStartsAt" type="datetime-local" required><input name="performanceEndsAt" type="datetime-local" required><input name="authorId" placeholder="编制人" required><button>创建案卷</button></form><div class="inline"><input id="case-id" placeholder="案卷标识"><button id="open" type="button">刷新案卷详情</button></div></section>
<div id="workspace" hidden>
<section><h2>草稿吊点批量编修</h2><p>先取得租约，再预检；确认无行级问题后使用相同数据提交。</p><div class="inline"><input id="lease-holder" placeholder="操作者"><button data-action="lease">取得编辑租约</button></div><textarea id="points-json" rows="7" aria-label="吊点批次">[{"id":"P1","label":"主吊点","xMillimeters":0,"yMillimeters":0,"ratedLoadKg":1000,"plannedStaticLoadKg":200,"slingAngleDegrees":60,"dynamicFactor":1.2}]</textarea><div class="inline"><button data-action="preflight">批量预检</button><button data-action="commit-points">确认提交</button></div></section>
<section><h2>器材配装与覆盖矩阵</h2><p>器材仍通过案卷的 <code>equipment</code> 动作登记；在这里提交主路径和冗余路径关系。</p><textarea id="assignments-json" rows="6" aria-label="配装关系">[]</textarea><div class="inline"><button data-action="assign">保存并校验配装</button><button data-action="coverage">查看覆盖矩阵</button></div></section>
<section><h2>载荷情景与正式评估</h2><textarea id="scenario-json" rows="5" aria-label="试算调整">[{"pointId":"P1","plannedStaticLoadKg":170}]</textarea><div class="inline"><input id="actor" placeholder="当前操作者"><button data-action="scenario">创建试算</button><input id="scenario-id" placeholder="情景标识"><button data-action="adopt">采用情景</button><button data-action="evaluate">直接正式评估</button></div></section>
<section><h2>彩排检查清单</h2><textarea id="observation-json" rows="5" aria-label="彩排观察">{"pointId":"P1","type":"位移","description":"重复测量","measurements":[{"value":0.2},{"value":0.3}]}</textarea><div class="inline"><button data-action="observe">提交观察</button><button data-action="progress">查看完成进度</button></div></section>
<section><h2>整改与定向复验</h2><textarea id="remediation-json" rows="5" aria-label="整改差异">{"findingId":"","actionType":"降载","changes":[{"kind":"降载","targetId":"P1","field":"plannedStaticLoadKg","before":"200","after":"170"}]}</textarea><div class="inline"><button data-action="remediate">提交整改</button><button data-action="plans">查看复验清单</button><input id="plan-id" placeholder="整改标识"><input id="retest-id" placeholder="复验项标识"><input id="retest-evidence" placeholder="复验证据说明"><button data-action="retest">提交通过结论</button></div></section>
<section><h2>独立复核与轮次</h2><div class="inline"><input id="reviewer" placeholder="安全复核员"><button data-action="evidence">证据完备清单</button><button data-action="review-submit">提交新复核轮次</button><button data-action="reviews">查看历史轮次</button><input id="review-id" placeholder="复核轮次标识"><select id="review-decision"><option>批准</option><option>退回</option></select><input id="review-reason" placeholder="决定理由"><button data-action="review-decide">提交决定</button></div><textarea id="return-json" rows="3" aria-label="退回意见">[]</textarea><div class="inline"><input id="return-id" placeholder="退回项标识"><input id="return-response" placeholder="逐项响应"><input id="return-evidence" placeholder="新修订证据"><button data-action="review-respond">关联响应</button></div></section>
<section><h2>放行凭据与验真</h2><div class="inline"><input id="issuer" placeholder="演出技术负责人"><button data-action="freeze">冻结并签发</button><input id="credential-id" placeholder="凭据标识"><button data-action="verify">验真诊断</button><button data-action="credentials">查看签发链</button><input id="revoke-reason" placeholder="撤销原因"><button data-action="revoke">负责人撤销</button><button data-action="timeline">审计时间线</button></div></section>
</div>
<section><h2>操作结果</h2><pre id="output">尚未创建或打开案卷</pre></section></main><script src="/static/app.js"></script></body></html>
